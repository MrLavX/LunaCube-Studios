# -----------------> ПОДСКАЗКИ <-----------------#
#
# Использование hex-цветов и градиентов:
# - https://docs.advntr.dev/minimessage/format.html
#
# (СКОРО) Использование PlaceholderAPI:
# - Формат: <papi:[papi_placeholder]>
# - Пример: <papi:luckperms_prefix>
#
# -----------------> ПОДСКАЗКИ <-----------------#

# Скоро можно будет перевести все сообщения.
messages:
  Main:
    no_access: '<gray>Нет прав на этот модуль: <yellow><permission>'
    disabled_module: <gray>Модуль <yellow><module> <gray>выключен, администрация
      должна включить эту функцию!
    player_only: '<gray>Эту команду может выполнить только игрок!'

  RedstoneLimiter:
    alert: <gray>Заблокировано <yellow><ticks> <gray>редстоун-тики в чанке <gradient:#c48d00:#fffb00><location></gradient><gray>!
    cooldown: <gray>Можно использовать <material> снова через <gradient:#c48d00:#fffb00><cooldown></gradient><gray>мс.

  WorldCleaner:
    # Формат сообщения -> "секунда=сообщение"
    countingdown:
    - 15=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунд сервер будет очищен от сущностей и предметов!
    - 10=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунд сервер будет очищен от сущностей и предметов!
    - 5=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунд сервер будет очищен от сущностей и предметов!
    - 4=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунд сервер будет очищен от сущностей и предметов!
    - 3=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунд сервер будет очищен от сущностей и предметов!
    - 2=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунд сервер будет очищен от сущностей и предметов!
    - 1=<gradient:#ff3c00:#ffff00>Внимание!</gradient> <gray>Через <color:#ff8800><remaining>
      <gray>секунду сервер будет очищен от сущностей и предметов!
    - 0=<gray>Успешно удалено <color:#ff8800><items>x <gray>предметов, <color:#ff8800><creatures>x
      <gray>сущностей и <color:#ff8800><projectiles>x <gray>снарядов!

    items:
      # Abyss — это место, куда попадают удалённые предметы; вернуть их можно командой /abyss
      abyss:
        close: <gray>Бездна успешно закрыта!
        open: '<gray>Бездна успешно открыта, забери предметы: <yellow>/abyss'
        empty: <gray>Бездна <blue>пуста<gray>, дождись следующего открытия!
        closed: <gray>Бездна <red>закрыта<gray>, дождись следующего открытия!
        opened: <gray>Инвентарь Бездны успешно <green>открыт<gray>!
        gui:
          name: <white>Бездна! <dark_gray>(<gray>страница <page><dark_gray>)
          previous: <dark_gray>← <red><b>ПРЕДЫДУЩАЯ СТРАНИЦА!</b>
          next: <dark_gray>→ <green><b>СЛЕДУЮЩАЯ СТРАНИЦА!</b>
