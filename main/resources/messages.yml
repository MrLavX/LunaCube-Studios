    - " &7▸ &f/lmc zone terminal &7- Установить терминал"
    - " &7▸ &f/lmc zone highlight <название> <мин> &7- Подсветить"
    - ""
    - " &7▸ &f/lmc start &7- Запустить комплекс"
    - " &7▸ &f/lmc stop &7- Остановить комплекс"
    - " &7▸ &f/lmc next &7- Следующее открытие"
    - " &7▸ &f/lmc status &7- Статус"
    - " &7▸ &f/lmc give <item> [player] &7- Выдать предмет"
    - " &7▸ &f/lmc boss spawn &7- Заспавнить босса"
