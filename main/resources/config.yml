# LunaMilitaryComplex v1.0.1 - Minecraft 1.21.11
# Полная настройка Военного комплекса

debug: false
main-zone: ""

# Расписание открытия
schedule:
  enabled: true
  interval-minutes: 120
  # Или конкретное время: "14:00", "20:00"
  times: []

# Настройки события
event:
  prep-time-seconds: 1800
  open-duration: 300
  rewards-duration: 300
  waves: 5
  wave-delay-seconds: 10

# Захват
capture:
  radius: 5.0
  time-seconds: 60
  pause-on-leave: true
  reset-on-leave: false

# Босс
boss:
  name: "&4&lКомандир комплекса"
  entity: ZOMBIE
  health: 500
  armor: 20
  damage: 15
  stages: 3
  spawn-effect: "EXPLOSION"
  death-effect: "LIGHTNING"
  bossbar:
    title: "&4&l%name% &7| &c%health%/%max-health% ❤"
    color: RED
    style: SOLID

# Модуль защиты
shield:
  settings:
    energy-drain: 1.0
    recharge-rate: 2.0
    default-max-energy: 1000
    default-radius: 50

# Удар
strike:
  settings:
    max-strikes: 3
    cooldown-minutes: 60
    warning-seconds: 10
    waves: 3
    explosions-per-wave: 5
    explosion-power: 4.0
    damage-players: true
    damage-blocks: true

# Отображение (actionbar / bossbar / message / none)
# Каждый тип можно настроить отдельно!
display:
  zone:
    display-type: "actionbar"
  capture:
    display-type: "actionbar"
    bossbar:
      title: "&a&lЗахват территории &7| &f%progress%/%max% &7(&f%percent%%&7)"
      color: GREEN
      style: SOLID
  event:
    display-type: "bossbar"
    bossbar:
      title: "&d&lВоенный комплекс &7| %phase% &7| %timer%с"
      color: PURPLE
      style: SOLID
  strike:
    display-type: "message"

# Частицы
particles:
  selection:
    color:
      r: 255
      g: 0
      b: 255
    size: 1.0
  capture:
    color:
      r: 0
      g: 255
      b: 0

# Звуки
sounds:
  countdown: BLOCK_NOTE_BLOCK_HAT
  siren: BLOCK_NOTE_BLOCK_PLING
  explosion: ENTITY_GENERIC_EXPLODE
  boss-spawn: ENTITY_WITHER_SPAWN
